<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ゲーム画面（デバッグ用）</title>
</head>
<body>
    <h1>ゲーム画面（デバッグ用）</h1>

    <form th:action="@{/game/start}" method="post">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">ゲームスタート</button>
    </form>

    <div th:if="${gameId != null}">
        <p>試合ID：<span th:text="${gameId}"></span></p>
        <p><span th:text="${dayNumber}"></span>日目</p>
        <p>現在のフェーズ：<span th:switch="${currentPhase.name()}"><span th:case="'MORNING'">朝・結果</span><span th:case="'DAY'">昼・相談</span><span th:case="'VOTE'">夕方・投票</span><span th:case="'NIGHT1'">夜・対象選択</span><span th:case="'NIGHT2'">夜・行動処理</span></span></p>

        <form th:if="${!isFinished and (currentPhase.name() != 'VOTE' or hasVoted) and (currentPhase.name() != 'NIGHT1' or hasNight1Acted) and (currentPhase.name() != 'NIGHT2' or hasNight2Resolved)}" th:action="@{/game/{id}/next(id=${gameId})}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">次のフェーズへ</button>
        </form>

        <form th:if="${currentPhase.name() == 'VOTE' and !isFinished and !hasVoted}" th:action="@{/game/{id}/vote(id=${gameId})}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">投票する</button>
        </form>

        <form th:if="${currentPhase.name() == 'NIGHT1' and !isFinished and !hasNight1Acted}" th:action="@{/game/{id}/night1(id=${gameId})}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">夜の行動</button>
        </form>

        <form th:if="${currentPhase.name() == 'NIGHT2' and !isFinished and !hasNight2Resolved}" th:action="@{/game/{id}/night2(id=${gameId})}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">夜2の処理</button>
        </form>

        <p>
            <a th:href="@{/game}">終了する</a>
        </p>

        <p th:if="${isFinished}">
            勝敗：<span th:text="${gameResult.name() == 'VILLAGER_WIN' ? '村人陣営の勝利' : '人狼陣営の勝利'}"></span>
        </p>

        <table border="1">
            <thead>
                <tr>
                    <th>席順</th>
                    <th>役職</th>
                    <th>生存</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="player : ${players}">
                    <td th:text="${player.seatOrder}"></td>
                    <td th:text="${player.roleName}"></td>
                    <td th:text="${player.isAlive} ? '生存' : '死亡'"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
