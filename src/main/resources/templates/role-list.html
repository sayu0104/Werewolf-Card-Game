<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>役職一覧</title>
</head>
<body>
    <h1>役職一覧</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>名前</th>
                <th>陣営</th>
                <th>説明</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="role : ${roles}">
                <td th:text="${role.id}"></td>
                <td th:text="${role.name}"></td>
                <td th:text="${role.faction}"></td>
                <td th:text="${role.description}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
